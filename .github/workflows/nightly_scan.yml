name: Nightly Conduit Scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent Conduit state
        run: python manage_conduit_state.py unpack

      - name: Run scans
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_all_scans.py

      - name: Validate critical intelligence outputs
        run: |
          python - <<'PYVALIDATE'
          import json
          import sys

          critical_files = {
              "locate_tickets.json": 1,
              "locate_tickets_history.json": 1,
              "topaz_activity.json": 1,
              "topaz_clusters.json": 1,
          }

          failed = False

          for filename, minimum in critical_files.items():
              try:
                  with open(filename, encoding="utf-8") as f:
                      data = json.load(f)

                  if not isinstance(data, list):
                      print(f"FAIL: {filename} is not a JSON list")
                      failed = True
                      continue

                  count = len(data)

                  if count < minimum:
                      print(f"FAIL: {filename} contains {count} records")
                      failed = True
                  else:
                      print(f"PASS: {filename} contains {count:,} records")

              except Exception as exc:
                  print(f"FAIL: {filename}: {exc}")
                  failed = True

          if failed:
              print("CRITICAL DATA VALIDATION FAILED")
              sys.exit(1)

          print("CRITICAL DATA VALIDATION PASSED")
          PYVALIDATE

          python validate_topaz.py

      - name: Pack persistent Conduit state
        run: python manage_conduit_state.py pack

      - name: Commit updated data
        run: |
          git config user.name "conduit-bot"
          git config user.email "conduit-bot@users.noreply.github.com"

          git add \
            locate_tickets_history.json.gz \
            topaz_event_registry.json.gz \
            topaz_scan_state.json \
            conduit_web_data.json \
            projects.json \
            builder_portfolios.json \
            land_intelligence.json \
            executive_brief.json \
            activity_feed.json \
            ask_conduit_answers.json

          git commit -m "Nightly Conduit data refresh" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
